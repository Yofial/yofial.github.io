<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>משנה בקביעותא</title>
<meta name="description" content="משנה בקביעותא – חמישה פרקי משנה בשבוע, כל הש״ס בשנתיים. לעילוי נשמת ינון פליישמן הי״ד.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4a6e">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="משנה בקביעותא">
<meta property="og:description" content="חמישה פרקי משנה בשבוע, כל הש״ס בשנתיים">
<meta property="og:image" content="flyer.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <img class="mark" src="icon.svg" alt="" width="64" height="64">
    <h1 id="title">משנה בקביעותא</h1>
    <p class="ded"><span id="ded">לעילוי נשמת ינון פליישמן הי״ד</span><small id="dedNote">ממשיכים ללמוד לזכרו ובדרכו</small></p>
    <p class="cycle" id="cycle"></p>
  </div>
</header>

<main class="wrap">
  <section class="about" id="about" aria-labelledby="aboutH"></section>

  <section id="home" class="view">
    <div class="week-head" id="weekHead"></div>
    <div id="week"></div>
    <div id="catchup"></div>
    <div id="next"></div>
    <button class="btn wide o" type="button" data-go="all">לכל ההתקדמות ←</button>
  </section>

  <section id="all" class="view" hidden>
    <button class="back" type="button" data-go="home">→ חזרה לשבוע</button>
    <h2>כל ההתקדמות</h2>
    <div id="summary"></div>
    <div class="seg" role="tablist" id="allTabs">
      <button type="button" role="tab" data-all="weeks" aria-selected="true">לפי שבועות</button>
      <button type="button" role="tab" data-all="tractates" aria-selected="false">לפי מסכתות</button>
    </div>
    <div id="allBody"></div>
  </section>

  <div class="account" id="account"></div>
</main>

<footer class="foot">
  <div class="foot-links" id="footLinks"></div>
  <p class="foot-ded" id="footDed"></p>
  <p class="foot-small">
    הטקסטים באדיבות <a href="https://www.sefaria.org.il" target="_blank" rel="noopener">ספריא</a>.
    <button type="button" class="lnk" id="openBackup">גיבוי והעברה</button>
  </p>
</footer>

<dialog id="backup">
  <form method="dialog" class="dlg">
    <h3>גיבוי והעברה בין מכשירים</h3>
    <p class="n">במצב אורח ההתקדמות נשמרת רק בדפדפן הזה. אפשר להעתיק קישור ולפתוח אותו במכשיר אחר. נוח יותר: להתחבר, וההתקדמות תישמר בחשבון.</p>
    <button type="button" class="btn" id="copyLink">העתקת קישור עם ההתקדמות</button>
    <details><summary class="n">טעינה מקוד</summary>
      <textarea id="codeIn" rows="2" dir="ltr" placeholder="הדביקו כאן קוד או קישור"></textarea>
      <button type="button" class="btn o" id="loadCode">טעינה</button>
    </details>
    <p><button type="button" class="lnk m" id="reset">איפוס כל ההתקדמות</button></p>
    <button class="btn o" value="close">סגירה</button>
  </form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
