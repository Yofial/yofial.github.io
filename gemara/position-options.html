<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>התמצאות בעמוד — שלוש אפשרויות</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2ead9;--ink:#26221c;--ink-soft:#665c48;--gemara:#1c2a3a;--comment:#4a3222;
    --accent:#5b3a29;--line:#d8c9a0;--margin:4.4rem;
    --mark:#6f675d;--gap:1.5rem;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Heebo',sans-serif;padding:0 1rem 3rem;}
  .wrap{max-width:1200px;margin:0 auto;}

  .top{padding:1rem 0 .5rem;}
  h1{font-size:1.2rem;margin:0 0 .5rem;color:var(--accent);}
  .row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;}
  .switch{display:inline-flex;border:1px solid var(--accent);border-radius:7px;overflow:hidden;}
  .switch label{cursor:pointer;}
  .switch input{position:absolute;opacity:0;pointer-events:none;}
  .switch span{display:block;padding:.35rem .8rem;font-size:.85rem;font-weight:600;color:var(--accent);}
  .switch input:checked + span{background:var(--accent);color:#fff;}
  .switch input:focus-visible + span{outline:2px solid #2f5233;outline-offset:-3px;}
  input,select,button{font:inherit;font-size:.85rem;padding:.3rem .5rem;border:1px solid var(--line);border-radius:5px;background:#fffdf7;color:var(--ink);}
  #daf{width:4.2rem;}
  button{background:var(--accent);color:#fff;border:none;font-weight:600;cursor:pointer;}
  button.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent);}
  .desc{margin:.7rem 0 0;padding:.6rem .8rem;background:#fffdf7;border:1px solid var(--line);border-radius:7px;font-size:.88rem;line-height:1.65;}
  .status{font-size:.8rem;color:var(--ink-soft);}

  .grid{display:grid;grid-template-columns:55% 1fr;column-gap:1.4rem;margin-inline-start:var(--margin);}
  .amud-head{grid-column:1/-1;margin:2rem 0 .6rem;margin-inline-start:calc(-1 * var(--margin));font-size:.95rem;font-weight:700;color:var(--accent);}
  .gemara-p,.comment-p{margin:0;padding-bottom:.5rem;position:relative;}
  /* y-clip lets a mid-paragraph step run from its line to the paragraph end; x stays visible for the margin */
  .gemara-p{align-self:stretch;overflow-x:visible;overflow-y:clip;color:var(--gemara);font-family:'Frank Ruhl Libre',serif;font-size:1.18rem;line-height:1.85;}
  .comment-p{color:var(--comment);font-size:.95rem;line-height:1.75;}
  .empty{color:#a89b83;}
  .zb,.cap{display:none;position:absolute;pointer-events:none;}

  /* everything is drawn in the margin, starting --gap away from the text and growing outward */
  .gemara-p::before,.gemara-p::after,.zb,.cap{left:calc(100% + var(--gap));}

  /* amud top and bottom: a short cap, like the corner of a printed page */
  .opt-steps .cap,.opt-wedge .cap{display:block;width:14px;border-top:1.5px solid var(--mark);}
  .cap.t{top:0;} .cap.b{bottom:0;}

  /* ---- A: three steps — hairline, medium, heavy ---- */
  .opt-steps .gemara-p::after{content:"";position:absolute;top:0;bottom:0;background:var(--mark);}
  .opt-steps .zb{display:block;height:300rem;margin-top:.95em;background:var(--mark);}
  .opt-steps .z1::after{width:1px;}
  .opt-steps .z2::after,.opt-steps .zb.z2{width:3.5px;}
  .opt-steps .z3::after,.opt-steps .zb.z3{width:7px;}

  /* ---- B: one continuous wedge per amud, hairline at the top, widest at the bottom ---- */
  .gemara-p::before{content:"";position:absolute;top:0;bottom:0;width:10px;background:var(--mark);
    clip-path:polygon(0 0,var(--ws) 0,var(--we) 100%,0 100%);display:var(--wedge,none);}
  .opt-wedge{--wedge:block;}

  /* ---- C: a floating miniature of the amud with the visible part marked ---- */
  .mini{display:none;position:fixed;top:36vh;z-index:5;flex-direction:column;align-items:center;gap:5px;pointer-events:none;}
  .opt-mini .mini{display:flex;}
  .mini-label{font:600 .7rem/1 'Heebo',sans-serif;color:var(--ink-soft);white-space:nowrap;}
  .mini-pg{position:relative;width:36px;height:50px;background:#fffdf7;border:1px solid #9a9082;border-radius:2px;overflow:hidden;box-shadow:0 1px 3px rgba(40,30,20,.15);}
  .mini-pg::before{content:"";position:absolute;inset:5px 6px;background:repeating-linear-gradient(to bottom,rgba(38,34,28,.14) 0 1px,transparent 1px 4px);}
  .mini-win{position:absolute;left:0;right:0;background:rgba(38,34,28,.32);border-block:1.5px solid #26221c;transition:top .12s,height .12s;}

  @media screen and (max-width:640px){
    :root{--margin:3.2rem;--gap:1.1rem;}
    .grid{grid-template-columns:1fr;}
    .comment-p{border-top:1px dashed var(--line);padding-top:.4rem;padding-bottom:.8rem;}
    /* single column: the commentary sits between gemara paragraphs, so the mark continues through it */
    .comment-p::before,.comment-p::after{left:calc(100% + var(--gap));}
    .opt-steps .comment-p::after{content:"";position:absolute;top:0;bottom:0;background:var(--mark);}
    .opt-steps .comment-p.z1::after{width:1px;}
    .opt-steps .comment-p.z2::after{width:3.5px;}
    .opt-steps .comment-p.z3::after{width:7px;}
    .comment-p::before{content:"";position:absolute;top:0;bottom:0;width:10px;background:var(--mark);
      clip-path:polygon(0 0,var(--ws) 0,var(--we) 100%,0 100%);display:var(--wedge,none);}
    .mini-pg{width:28px;height:39px;}
  }
  @media print{
    @page{margin:1.4cm;}
    :root{--gemara:#000;--comment:#000;--accent:#000;--ink:#000;--line:#777;--mark:#000;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    body{background:#fff;padding:0;}
    .top,.mini{display:none !important;}
    /* the floating miniature can't exist on paper, so option C prints the wedge */
    .opt-mini{--wedge:block;}
    .opt-mini .cap{display:block;width:14px;border-top:1.5px solid #000;}
    .gemara-p,.comment-p{orphans:3;widows:3;}
    .amud-head{break-after:avoid;}
  }
</style>
</head>
<body class="opt-steps">
<div class="wrap">
  <div class="top">
    <h1>התמצאות בעמוד — בלי צבע, בלי מספרים, רק בשוליים</h1>
    <div class="row">
      <div class="switch" role="radiogroup" aria-label="אפשרות">
        <label><input type="radio" name="opt" value="steps" checked><span>א · מדרגות</span></label>
        <label><input type="radio" name="opt" value="wedge"><span>ב · טריז</span></label>
        <label><input type="radio" name="opt" value="mini"><span>ג · דף ממוזער</span></label>
      </div>
      <select id="book" aria-label="מסכת"></select>
      <input id="daf" type="number" min="2" value="2" aria-label="דף">
      <select id="amud" aria-label="עמוד"><option value="a">עמוד א</option><option value="b">עמוד ב</option></select>
      <button id="load">טען</button>
      <button class="secondary" id="print">הדפסה</button>
      <span class="status" id="status" role="status"></span>
    </div>
    <p class="desc" id="desc"></p>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div class="mini" id="mini" aria-hidden="true"><span class="mini-label" id="miniLabel"></span><div class="mini-pg"><i class="mini-win" id="miniWin"></i></div></div>

<script>
const API = 'https://www.sefaria.org/api';
const $ = id => document.getElementById(id);

const TRACTATES = [
  ['Berakhot','ברכות'],['Shabbat','שבת'],['Pesachim','פסחים'],['Yoma','יומא'],['Sukkah','סוכה'],
  ['Megillah','מגילה'],['Ketubot','כתובות'],['Gittin','גיטין'],['Kiddushin','קידושין'],
  ['Bava Kamma','בבא קמא'],['Bava Metzia','בבא מציעא'],['Sanhedrin','סנהדרין'],['Chullin','חולין'],['Bekhorot','בכורות']
];
const DESC = {
  steps: '<b>מדרגות:</b> קו אחד בשוליים, בדיו בלבד. בשליש העליון הוא קו שערה, באמצע בינוני, ובשליש התחתון עבה. כל קטע שנראה על המסך מספר לבד באיזה שליש הוא. קווים קצרים בראש העמוד ובסופו מסמנים את גבולות הדף. עובד גם בהדפסה.',
  wedge: '<b>טריז:</b> כל עמוד הוא טריז אחד רציף: דק כחוט בראש העמוד ומתרחב בהדרגה עד סופו. אין מדרגות ואין קפיצות, רק תחושה של "כמה כבר ירדתי בדף". בעמוד חדש הטריז מתחיל שוב דק. עובד גם בהדפסה.',
  mini: '<b>דף ממוזער:</b> ציור קטן וקבוע בצד המסך, שהוא תמיד דף אחד בגודל אחד, בלי קשר לאורך העמוד. החלון הכהה בתוכו מראה איזה חלק מהעמוד נמצא עכשיו על המסך. הטקסט והשוליים נשארים נקיים לגמרי. בהדפסה מודפס הטריז.'
};

function hebrewNumeral(n){
  const H=[[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק']],T=[[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י']],
        O=[[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];
  let r=n;const p=[];
  for(const [v,l] of H) while(r>=v){p.push(l);r-=v;}
  if(r===15){p.push('ט','ו');r=0;} else if(r===16){p.push('ט','ז');r=0;}
  else{
    for(const [v,l] of T) if(r>=v){p.push(l);r-=v;break;}
    for(const [v,l] of O) if(r>=v){p.push(l);r-=v;break;}
  }
  if(p.length===1) return p[0]+'\u05F3';
  return p.slice(0,-1).join('')+'\u05F4'+p[p.length-1];
}
const normRef = s => (s || '').toLowerCase().replace(/[._:]/g,' ').replace(/\s+/g,' ').trim();

async function getJSON(url){
  const res = await fetch(url, { headers: { accept: 'application/json' } });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}
async function fetchGemara(ref){
  const d = await getJSON(`${API}/v3/texts/${encodeURIComponent(ref)}?version=hebrew`);
  const t = d.versions?.[0]?.text;
  if (!t || !t.length) throw new Error('לא נמצא טקסט עבור ' + ref);
  return Array.isArray(t) ? t.flat(Infinity) : [t];
}
async function fetchRashi(ref){
  const links = await getJSON(`${API}/links/${encodeURIComponent(ref)}?with_text=1&category=Commentary`);
  const map = new Map();
  for (const l of links) {
    if (!(l.collectiveTitle?.en || l.index_title || '').toLowerCase().includes('rashi')) continue;
    const anchor = normRef(l.anchorRef || (l.anchorRefExpanded || [])[0]);
    const text = (l.he || (Array.isArray(l.text) ? l.text.join(' ') : l.text) || '').trim();
    if (!anchor || !text) continue;
    if (!map.has(anchor)) map.set(anchor, []);
    map.get(anchor).push(text);
  }
  return map;
}

// Position = share of the amud's Hebrew letters, so it matches on any screen, in print, and ignores commentary length.
const isLetter = c => c >= '\u05D0' && c <= '\u05EA';
const letterCount = html => [...html.replace(/<[^>]*>/g, '')].filter(isLetter).length;
const zoneAt = (n, total) => n * 3 < total ? 1 : n * 3 < total * 2 ? 2 : 3;
const wedgePx = f => (1 + f * 9).toFixed(2) + 'px';

// Inserts a step anchor after the word in which a third of the amud is crossed.
// A crossing on the paragraph's last word is dropped: the next paragraph already starts in the new zone.
function insertSteps(html, from, total){
  let n = from, z = zoneAt(from, total), out = '', inTag = false, pending = 0, end = z;
  for (const c of html) {
    if (inTag) { out += c; if (c === '>') inTag = false; continue; }
    if (c === '<') { inTag = true; out += c; continue; }
    if (pending && /\s/.test(c)) { out += `<span class="zb z${pending}" aria-hidden="true"></span>`; end = pending; pending = 0; }
    out += c;
    if (isLetter(c)) { n++; while (z < 3 && n * 3 >= z * total) pending = ++z; }
  }
  return { html: out, end };
}

const labels = {};
async function amudHTML(bookEn, bookHe, daf, amud){
  const ref = `${bookEn}.${daf}${amud}`, id = `${daf}${amud}`;
  const [segs, rashi] = await Promise.all([fetchGemara(ref), fetchRashi(ref).catch(() => new Map())]);
  const lens = segs.map(letterCount), total = lens.reduce((a, b) => a + b, 0) || 1;
  labels[id] = `${hebrewNumeral(daf)} ע״${amud === 'a' ? 'א' : 'ב'}`;
  let acc = 0, html = `<h2 class="amud-head">${bookHe} ${labels[id]}</h2>`;
  segs.forEach((seg, i) => {
    const s = acc / total, e = (acc + lens[i]) / total, r = insertSteps(seg, acc, total);
    const caps = (i === 0 ? '<span class="cap t"></span>' : '') + (i === segs.length - 1 ? '<span class="cap b"></span>' : '');
    const c = (rashi.get(normRef(`${ref}.${i + 1}`)) || []).join(' ');
    html += `<p class="gemara-p z${zoneAt(acc, total)}" data-amud="${id}" data-s="${s}" data-e="${e}" style="--ws:${wedgePx(s)};--we:${wedgePx(e)}">${caps}${r.html}</p>`
      + `<p class="comment-p z${r.end}" style="--ws:${wedgePx(e)};--we:${wedgePx(e)}">${c || '<span class="empty">—</span>'}</p>`;
    acc += lens[i];
  });
  return html;
}

// ---- C: floating miniature ----
function placeMini(){
  const g = $('grid'), m = parseFloat(getComputedStyle(g).marginRight) || 0;
  const w = $('mini').offsetWidth || 32;
  $('mini').style.right = Math.max(4, document.documentElement.clientWidth - g.getBoundingClientRect().right - m + (m - w) / 2) + 'px';
}
function updateMini(){
  if (document.body.className !== 'opt-mini') return;
  const paras = [...document.querySelectorAll('.gemara-p')];
  if (!paras.length) return;
  const vh = window.innerHeight, readY = vh * .4;
  let cur = paras[0];
  for (const p of paras) { if (p.getBoundingClientRect().top <= readY) cur = p; else break; }
  const ps = paras.filter(p => p.dataset.amud === cur.dataset.amud);
  const fracAt = y => {
    let prev = 0;
    for (const p of ps) {
      const r = p.getBoundingClientRect(), s = +p.dataset.s, e = +p.dataset.e;
      if (y < r.top) return prev;
      if (y < r.bottom) return s + (e - s) * (y - r.top) / r.height;
      prev = e;
    }
    return 1;
  };
  const a = fracAt(0), b = fracAt(vh);
  $('miniWin').style.top = a * 100 + '%';
  $('miniWin').style.height = Math.max(.03, b - a) * 100 + '%';
  $('miniLabel').textContent = labels[cur.dataset.amud];
}
let raf = 0;
const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; updateMini(); }); };
window.addEventListener('scroll', schedule, { passive: true });
window.addEventListener('resize', () => { placeMini(); schedule(); });

async function load(){
  const bookEn = $('book').value, bookHe = $('book').selectedOptions[0].textContent;
  const daf = Math.max(2, parseInt($('daf').value, 10) || 2), amud = $('amud').value;
  const next = amud === 'a' ? [daf, 'b'] : [daf + 1, 'a'];
  $('load').disabled = true; $('status').textContent = 'טוען…';
  try {
    const parts = await Promise.all([amudHTML(bookEn, bookHe, daf, amud), amudHTML(bookEn, bookHe, ...next).catch(() => '')]);
    $('grid').innerHTML = parts.join('');
    $('status').textContent = '';
    placeMini(); schedule();
  } catch (err) {
    $('status').textContent = 'שגיאה: ' + err.message;
  } finally { $('load').disabled = false; }
}

function setOption(v){
  if (!DESC[v]) v = 'steps';
  document.body.className = 'opt-' + v;
  document.querySelector(`input[name=opt][value="${v}"]`).checked = true;
  $('desc').innerHTML = DESC[v];
  history.replaceState(null, '', '#' + v);
  placeMini(); schedule();
}

$('book').innerHTML = TRACTATES.map(([en, he]) => `<option value="${en}">${he}</option>`).join('');
$('book').value = 'Berakhot';
document.querySelectorAll('input[name=opt]').forEach(r => r.addEventListener('change', () => setOption(r.value)));
$('load').addEventListener('click', load);
$('print').addEventListener('click', () => window.print());
setOption(location.hash.slice(1));
load();
</script>
</body>
</html>
